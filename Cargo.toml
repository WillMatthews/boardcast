[package]
name = "boardvu"
version = "0.1.0"
edition = "2024"
description = "A virtual camera of your blackboard: deskewed, cleaned up, with you as a see-through ghost"
license = "MIT"
repository = "https://github.com/WillMatthews/boardvu"
readme = "README.md"
keywords = ["blackboard", "webcam", "v4l2loopback", "virtual-camera", "teaching"]
categories = ["multimedia::video", "command-line-utilities"]

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
ctrlc = "3.5.3"
libc = "0.2.191"
ort = "2.0.0-rc.15"
png = "0.18.1"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.2"
v4l = "0.14.0"
zune-jpeg = "0.5.15"
